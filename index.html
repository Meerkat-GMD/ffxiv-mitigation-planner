<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mitigation Planner Prototype</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="topbar">
            <div>
                <h1>Mitigation Planner</h1>
                <p>기믹 타임라인과 파티 뎀감을 함께 편집하는 프로토타입</p>
            </div>
            <div class="status">
                <span id="connectionDot" class="dot"></span>
                <span id="connectionLabel">연결 중</span>
                <span id="onlineCount">0명 접속</span>
                <button id="newTimelineButton" type="button">새 타임라인</button>
                <button id="savePlanButton" type="button">저장</button>
                <button id="loadPlanButton" type="button">불러오기</button>
                <input id="loadPlanInput" type="file" accept="application/json,.json" hidden />
                <button id="openActionEditorButton" type="button">스킬 편집</button>
                <button id="resetButton" type="button">초기화</button>
            </div>
        </header>

        <main class="layout">
            <section class="panel party-panel">
                <div class="panel-heading">
                    <h2>파티 / 직업</h2>
                </div>
                <div id="partyGrid" class="party-grid"></div>
            </section>

            <section class="panel mechanics-panel">
                <div class="panel-heading">
                    <h2>기믹</h2>
                    <button id="addMechanicButton" type="button">추가</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>시간</th>
                                <th>이름</th>
                                <th>피해량</th>
                                <th>종류</th>
                                <th>대상</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="mechanicsBody"></tbody>
                    </table>
                </div>
            </section>

            <section class="panel mitigation-panel">
                <div class="panel-heading">
                    <h2>타임라인 스킬</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>이동</th>
                                <th>시작</th>
                                <th>지속</th>
                                <th>사용자</th>
                                <th>스킬</th>
                                <th>쿨</th>
                                <th>감소</th>
                                <th>실드</th>
                                <th>종류</th>
                                <th>대상</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="mitigationsBody"></tbody>
                    </table>
                </div>
            </section>

            <section class="panel timeline-panel">
                <div class="panel-heading">
                    <h2>적용 범위</h2>
                    <span id="timelineRange"></span>
                </div>
                <div id="timeline" class="timeline"></div>
            </section>

            <section class="panel results-panel">
                <div class="panel-heading">
                    <h2>생존 예측</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>시간</th>
                                <th>기믹</th>
                                <th>활성 뎀감</th>
                                <th>최대 피해</th>
                                <th>최저 남은 HP</th>
                                <th>판정</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <section id="actionEditorView" class="editor-view" hidden>
            <div class="editor-shell">
                <div class="editor-heading">
                    <div>
                        <h2>직업별 스킬 편집</h2>
                        <p>우클릭 메뉴에 뜨는 스킬 목록과 계산값을 수정합니다.</p>
                    </div>
                    <div class="editor-actions">
                        <button id="addActionButton" type="button">추가</button>
                        <button id="closeActionEditorButton" type="button">닫기</button>
                    </div>
                </div>
                <div class="table-wrap editor-table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>스킬</th>
                                <th>별칭</th>
                                <th>직업</th>
                                <th>쿨</th>
                                <th>지속</th>
                                <th>감소</th>
                                <th>실드위력</th>
                                <th>기준</th>
                                <th>종류</th>
                                <th>대상</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="actionsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-database-compat.js"></script>
        <script src="firebase-config.js"></script>
        <script src="app.js"></script>
    </body>
</html>
